<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boran Eşarp Tekstil - Yönetim</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b2a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boran Eşarp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Google sunucularına bağlantı sayfa açılır açılmaz başlasın -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://n-script.googleusercontent.com">
<link rel="preload" as="image" href="/gorseller/logo_beyaz.png">
<style>
  html, body { margin: 0; height: 100%; background: #1b2a4e; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; background: transparent; }
  /* Açılış ekranı: uygulama Google'da hazırlanırken görünür */
  #acilis { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
            background: radial-gradient(circle at 50% 42%, #2a4072 0%, #1b2a4e 55%, #111c36 100%);
            color: #fff; font: 500 14px -apple-system, system-ui, sans-serif; transition: opacity .45s ease; }
  #acilis.gizle { opacity: 0; pointer-events: none; }
  /* Beyaz logo + üzerinde ilerleyen ışık (ışık yalnızca logonun çizgisinde görünür) */
  .logo { position: relative; width: 150px; height: 150px; }
  .logo img { width: 100%; height: 100%; display: block; opacity: .9; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
  .logo .isik { position: absolute; inset: 0;
    -webkit-mask: url(/gorseller/logo_beyaz.png) center / contain no-repeat; mask: url(/gorseller/logo_beyaz.png) center / contain no-repeat;
    background: linear-gradient(105deg, transparent 0%, transparent 38%, rgba(233,217,166,.95) 47%, #fff 50%, rgba(233,217,166,.95) 53%, transparent 62%, transparent 100%);
    background-size: 300% 100%; animation: isik 1.6s ease-in-out infinite; }
  @keyframes isik { 0% { background-position: 100% 0; } 100% { background-position: 0% 0; } }
  .oran { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 300; letter-spacing: .06em; color: #e9d9a6; min-width: 4ch; text-align: center; }
  .alt { font-size: 11px; letter-spacing: .32em; color: rgba(255,255,255,.55); margin-top: -14px; }
</style>
</head>
<body>
<div id="acilis" role="status" aria-live="polite">
  <div class="logo"><img src="/gorseller/logo_beyaz.png" alt="Boran Eşarp"><div class="isik"></div></div>
  <div class="oran" id="oran">%0</div>
  <div class="alt">BORAN EŞARP</div>
</div>
<!-- Uygulamanın kendisi ve verisi Google'da (Apps Script + Google Tablo) kalır; bu sayfa giriş ekranıyla birlikte onu tam ekran gösterir. -->
<iframe id="uygulama" title="Boran Eşarp Tekstil - Yönetim" allow="clipboard-read; clipboard-write; camera; fullscreen; web-share" allowfullscreen></iframe>
<script>
  var UYGULAMA = 'https://script.google.com/macros/s/AKfycbwV9mnd_ndaK6w-nOSOwzATnAfg5hcZUhQwJtlf5jp6rMJFj4_J8t2l8YsglgRfw_uM/exec';
  // Adresteki parametreler (ör. ?kart=...) uygulamaya aynen geçer; alan=1 çıkışta bu sayfaya dönmeyi sağlar
  var p = new URLSearchParams(location.search);
  p.set('alan', '1');
  var cerceve = document.getElementById('uygulama'), acilis = document.getElementById('acilis'), oranYazi = document.getElementById('oran');

  // Açılış oranı: Google yükleme ilerlemesini dışarıya vermediği için bu cihazdaki önceki açılış süresine göre tahmin edilir;
  // uygulama gerçekten hazır olunca %100 olur.
  var basla = Date.now(), bitti = false, tahmin = 4000;
  try { tahmin = Math.min(15000, Math.max(1500, +localStorage.getItem('boranAcilisMs') || 4000)); } catch (e) {}
  function goster(o) { oranYazi.textContent = '%' + Math.round(o); }
  (function adim() {
    if (bitti) return;
    var t = (Date.now() - basla) / tahmin;            // 1 = beklenen süre
    goster(t < 1 ? 90 * t : 90 + 9 * (1 - Math.exp(-(t - 1) * 1.5))); // beklenen sürede %90, sonra %99'a yavaşça yaklaşır
    requestAnimationFrame(adim);
  })();
  function ac() {
    if (bitti) return; bitti = true; goster(100);
    try { localStorage.setItem('boranAcilisMs', String(Date.now() - basla)); } catch (e) {}
    setTimeout(function () { acilis.classList.add('gizle'); setTimeout(function () { acilis.style.display = 'none'; }, 500); }, 250);
  }
  cerceve.addEventListener('load', function () { setTimeout(ac, 150); });
  setTimeout(ac, 25000); // her ihtimale karşı: 25 sn sonra açılış ekranı kalkar
  // Uygulama "hazırım" derse beklemeden açılır
  window.addEventListener('message', function (o) { if (/googleusercontent\.com$/.test(o.origin) && o.data && o.data.tur === 'boran-hazir') ac(); });
  cerceve.src = UYGULAMA + '?' + p.toString();
</script>
</body>
</html>
